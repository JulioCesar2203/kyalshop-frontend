<div class="p-4 bg-white rounded-3 shadow-sm" style="min-height: 80vh;">
  
  <!-- CABECERA -->
  <div class="d-flex justify-content-between align-items-center mb-5 border-bottom pb-3">
    <div>
      <h3 class="fw-bold text-dark m-0">Seguridad</h3>
      <p class="text-muted small m-0">Administra tus credenciales de acceso al sistema</p>
    </div>
    <button class="btn btn-primary px-4 fw-bold" (click)="guardar()">
      <i class="bi bi-save me-2"></i> Actualizar Contraseña
    </button>
  </div>

  <!-- FORMULARIO -->
  <form [formGroup]="seguridadForm">
    <div class="row">
      
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card p-4 border-0 shadow-sm" style="background-color: #f8fafc; border-radius: 16px;">
          
          <div class="d-flex align-items-center mb-4">
            <div class="bg-white text-primary rounded-circle d-flex justify-content-center align-items-center me-3 shadow-sm" style="width: 45px; height: 45px;">
              <i class="bi bi-shield-lock-fill fs-5"></i>
            </div>
            <h5 class="fw-bold m-0 text-dark">Cambio de Contraseña</h5>
          </div>
          
          <div class="mb-3">
            <label class="form-label text-muted small fw-bold">NUEVA CONTRASEÑA *</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted border-end-0">
                <i class="bi bi-key"></i>
              </span>
              <input 
                type="password" 
                class="form-control border-start-0 ps-0" 
                formControlName="nuevaContrasena" 
                placeholder="Escribe un mínimo de 6 caracteres"
                [ngClass]="{'is-invalid': seguridadForm.get('nuevaContrasena')?.invalid && seguridadForm.get('nuevaContrasena')?.touched}">
            </div>
            
            <div *ngIf="seguridadForm.get('nuevaContrasena')?.invalid && seguridadForm.get('nuevaContrasena')?.touched" class="text-danger small mt-1 fw-bold">
              <i class="bi bi-exclamation-circle"></i> La nueva contraseña es obligatoria.
            </div>
            
            <small class="text-muted d-block mt-3">
              <i class="bi bi-info-circle text-primary me-1"></i>
              Al presionar "Actualizar", tu contraseña anterior dejará de funcionar inmediatamente.
            </small>
          </div>

        </div>
      </div>

    </div>
  </form>

</div>
