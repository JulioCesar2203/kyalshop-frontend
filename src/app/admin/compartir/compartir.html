<div class="d-flex justify-content-center align-items-center h-100 p-4">
  
  <div class="card share-card shadow-lg text-center p-5">
    
    <!-- Icono Circular Superior -->
    <div class="icon-container mx-auto mb-4 d-flex justify-content-center align-items-center">
      <i class="bi bi-share-fill text-success fs-3"></i>
    </div>

    <h3 class="text-white fw-bold mb-3">¡Listo para compartir!</h3>
    <p class="text-muted small mb-4">
      Tu formulario personalizado está activo. Comparte el siguiente enlace con tus clientes.
    </p>

    <!-- Input con el Link -->
    <div class="mb-4">
      <input 
        type="text" 
        class="form-control text-center custom-link-input" 
        [value]="linkCompartir" 
        readonly>
    </div>

    <!-- Botones de Acción -->
    <div class="d-flex flex-column gap-3">
      <button class="btn btn-primary fw-bold py-2" (click)="copiarLink()">
        Copiar Link
      </button>

      <button class="btn btn-success fw-bold py-2 custom-wa-btn" (click)="enviarWhatsApp()">
        <i class="bi bi-whatsapp me-2"></i> Enviar por WhatsApp
      </button>

      <button class="btn btn-outline-secondary text-white fw-bold py-2 border-0 custom-blank-btn" (click)="abrirNuevaPestana()">
        <i class="bi bi-box-arrow-up-right me-2"></i> Abrir en nueva pestaña
      </button>
    </div>

  </div>

</div>
