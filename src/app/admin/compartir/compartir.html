<div class="d-flex justify-content-center align-items-center h-100 p-4">
  <div class="card share-card shadow bg-white p-5 border-0 rounded-4" style="max-width: 550px; width: 100%;">
    
    <div class="text-center mb-4">
      <h4 class="fw-bold text-dark mb-2">Compartir Formularios</h4>
      <p class="text-muted small">Copia el enlace correspondiente según el tipo de cliente.</p>
    </div>

    <!-- LINK 1: KYALSHOP -->
    <div class="mb-4 p-3 rounded-3" style="background-color: #f8fafc; border: 1px solid #e2e8f0;">
      <div class="d-flex align-items-center mb-2">
        <img src="/assets/images/logo_kyalshop.png" height="24" class="me-2" style="mix-blend-mode: multiply;">
        <span class="fw-bold text-dark">KyalShop</span>
      </div>
      <div class="input-group shadow-sm">
        <input type="text" class="form-control bg-white fw-medium text-primary" [value]="linkShop" readonly>
        <button class="btn btn-primary fw-bold px-3" (click)="copiarLink(linkShop)">Copiar</button>
        <button class="btn btn-outline-secondary px-3" (click)="abrirNuevaPestana(linkShop)"><i class="bi bi-box-arrow-up-right"></i></button>
      </div>
    </div>

    <!-- LINK 2: KYALCOURIER -->
    <div class="mb-2 p-3 rounded-3" style="background-color: #f8fafc; border: 1px solid #e2e8f0;">
      <div class="d-flex align-items-center mb-2">
        <span class="fw-bold text-dark"><i class="bi bi-airplane-engines-fill text-warning me-2"></i>KyalCourier</span>
      </div>
      <div class="input-group shadow-sm">
        <input type="text" class="form-control bg-white fw-medium text-primary" [value]="linkCourier" readonly>
        <button class="btn btn-warning text-dark fw-bold px-3" (click)="copiarLink(linkCourier)">Copiar</button>
        <button class="btn btn-outline-secondary px-3" (click)="abrirNuevaPestana(linkCourier)"><i class="bi bi-box-arrow-up-right"></i></button>
      </div>
    </div>

  </div>
</div>
