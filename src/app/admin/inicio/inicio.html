<div class="w-100">
  
  <!-- FRANJA AZUL DE BIENVENIDA (Con Marca de Agua) -->
  <div class="banner-bienvenida position-relative overflow-hidden d-flex flex-column justify-content-center align-items-center text-center text-white" style="background-color: #0b3d60; height: 260px;">
    
    <!-- MARCA DE AGUA CORPORATIVA -->
    <img src="/assets/images/logo_kyalshop.png" alt="Watermark" class="watermark-logo">

    <!-- TEXTOS PRINCIPALES -->
    <div class="position-relative z-2 mt-4">
      <h2 class="fw-bold mb-2">Bienvenido/a</h2>
      <p class="text-light m-0 fs-5" style="opacity: 0.9;">Selecciona un módulo para gestionar el sistema.</p>
    </div>
  </div>

  <!-- CONTENEDOR DE TARJETAS (Efecto flotante) -->
  <!-- Le agregamos position-relative y z-3 para que floten por encima de la marca de agua -->
  <div class="container position-relative z-3" style="margin-top: -60px; max-width: 1000px; padding-bottom: 50px;">
    <div class="row g-4 justify-content-center">
      
      @for (modulo of modulos; track modulo.url) {
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card module-card h-100 border-0 shadow-sm rounded-4" [routerLink]="modulo.url">
            
            <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
              <!-- Círculo para el ícono -->
              <div class="icon-circle mb-3 d-flex justify-content-center align-items-center rounded-circle">
                <i [class]="modulo.icono + ' fs-1'"></i>
              </div>
              <h5 class="fw-bold module-title mb-1">{{ modulo.titulo }}</h5>
              <span class="text-muted small text-uppercase fw-bold" style="font-size: 0.7rem; letter-spacing: 1px;">ADMIN {{ modulo.titulo }}</span>
            </div>
            
          </div>
        </div>
      }
      
    </div>
  </div>

</div>
